[build]
  publish = "web"
  functions = "netlify/functions"

[functions]
  included_files = ["recipes/claude/**", "recipes/raw-html/**/*.html"]

[[redirects]]
  from = "/api/recipes"
  to = "/.netlify/functions/recipes"
  status = 200

[[redirects]]
  from = "/api/recipe-states"
  to = "/.netlify/functions/recipe-states"
  status = 200

[[redirects]]
  from = "/api/recipe-state"
  to = "/.netlify/functions/recipe-state"
  status = 200

[[redirects]]
  from = "/api/recipe-edit"
  to = "/.netlify/functions/recipe-edit"
  status = 200

[[redirects]]
  from = "/api/recipe-upload"
  to = "/.netlify/functions/recipe-upload"
  status = 200

[[redirects]]
  from = "/api/shopping-list"
  to = "/.netlify/functions/shopping-list"
  status = 200

[[redirects]]
  from = "/mealime/*"
  to = "/.netlify/functions/mealime-recipe/:splat"
  status = 200

[[redirects]]
  from = "/api/cook-log"
  to = "/.netlify/functions/cook-log"
  status = 200

# --- Weight tracker (side project at /weight/) ---
[[redirects]]
  from = "/api/weight-auth"
  to = "/.netlify/functions/weight-auth"
  status = 200

[[redirects]]
  from = "/api/weight-entries"
  to = "/.netlify/functions/weight-entries"
  status = 200

[[redirects]]
  from = "/api/weight-push"
  to = "/.netlify/functions/weight-push"
  status = 200

[[redirects]]
  from = "/api/weight-ingest"
  to = "/.netlify/functions/weight-ingest"
  status = 200

# Reminder sender runs every 15 minutes (scheduled function).
[functions."weight-reminders"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/recipes/*"
  to = "/.netlify/functions/recipe-page"
  status = 200
