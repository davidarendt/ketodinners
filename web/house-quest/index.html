<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1F3FB0}
.app{width:390px;height:844px;background:#EEF0F3;color:#1B1F27;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;position:relative}
.disp{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.scroll{flex:1;overflow-y:auto;padding:12px 16px 28px;display:flex;flex-direction:column;gap:14px}
.card{background:#FFFFFF;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 rgba(27,31,39,.06)}
.card.target{box-shadow:0 0 0 3px #E08A45}
.dark{background:#1B1F27;color:#FFFFFF}
.drop{background:#FFF1E3;border:2px dashed #E08A45}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5A6170}
.dark .lbl{color:#A9B0BE}
.h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:20px;font-weight:800;padding:6px 2px 0}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap;gap:6px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:4px}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#E3E7EE;color:#3A4150;white-space:nowrap;text-decoration:none}
.chip.fit{background:#DCE6FF;color:#1F3FB0}
.chip.later{background:#FBE6D6;color:#8A3E0B}
.chip.ready{background:#D6F0E2;color:#17603A}
.chip.boost{background:#FFE7CF;color:#7A3608}
.chip.season{background:#E9F5D0;color:#3D5A0E}
.chip.link{background:#FFFFFF;border:1.5px solid #C9CED8;color:#1F3FB0}
.btn{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer;background:#E3E7EE;color:#1B1F27;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box}
.btn.pri{background:#2F5BEA;color:#FFFFFF}
.btn.warm{background:#B8520F;color:#FFFFFF}
.btn.ghost{background:transparent;color:#4A5160}
.btn.full{width:100%}
.btn.sm{min-height:36px;font-size:13px;padding:0 12px}
.iconbtn{font:inherit;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:#1B1F27;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn.on{background:#DDE1E8}
.meter{height:10px;border-radius:999px;background:#E3E7EE;overflow:hidden}
.dark .meter{background:#343A47}
.fill{height:100%;border-radius:999px;background:#2F5BEA}
.dark .fill{background:#7C9BFF}
.fill.xp{background:#F0954D}
.fill.save{background:#2E9E62}
.vote{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.vote.v3{grid-template-columns:repeat(3,minmax(0,1fr))}
.vote.v4{grid-template-columns:repeat(4,minmax(0,1fr))}
.vbtn{font:inherit;font-weight:700;font-size:16px;min-height:44px;border-radius:12px;border:2px solid #D3D8E1;background:#FFFFFF;color:#1B1F27;cursor:pointer}
.vbtn.txt{font-size:13px;padding:6px 4px;line-height:1.2}
.vbtn.on{background:#2F5BEA;border-color:#2F5BEA;color:#FFFFFF}
.catgrid{display:flex;flex-wrap:wrap;gap:8px}
.cbtn{font:inherit;font-size:14px;font-weight:500;min-height:40px;padding:0 14px;border-radius:999px;border:2px solid #D3D8E1;background:#FFFFFF;color:#1B1F27;cursor:pointer}
.cbtn.on{background:#1B1F27;border-color:#1B1F27;color:#FFFFFF}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:700;color:#3A4150}
.inp{font:inherit;font-size:16px;min-height:48px;padding:0 14px;border-radius:12px;border:2px solid #D3D8E1;background:#FFFFFF;color:#1B1F27;box-sizing:border-box;width:100%;min-width:0}
.inp:focus{outline:none;border-color:#2F5BEA}
.fund{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fbtn{font:inherit;text-align:left;border:2px solid #D3D8E1;background:#FFFFFF;color:#1B1F27;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.fbtn b{font-size:15px}
.fbtn span{font-size:12px;color:#565D6C}
.fbtn.on{border-color:#2F5BEA;background:#EEF3FF}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #DDE1E8;padding:6px 4px 22px}
.tab{font:inherit;font-size:11px;font-weight:700;background:transparent;border:0;color:#5F6675;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;justify-content:center;cursor:pointer;position:relative}
.tab.on{color:#2F5BEA}
.badge{position:absolute;top:2px;right:12px;background:#B8520F;color:#FFFFFF;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.seg{display:flex;background:#DDE1E8;border-radius:999px;padding:3px}
.sbtn{font:inherit;font-size:13px;font-weight:700;border:0;background:transparent;color:#3A4150;border-radius:999px;padding:0 10px;min-height:34px;cursor:pointer}
.sbtn.on{background:#FFFFFF;color:#1B1F27}
.mini{font-size:13px;color:#565D6C}
.imp{display:flex;gap:12px;font-size:13px;color:#3A4150}
.imp b{font-weight:700;color:#1B1F27}
.toast{position:absolute;left:16px;right:16px;top:64px;pointer-events:none;box-shadow:0 8px 24px rgba(27,31,39,.25);background:#1B1F27;color:#FFFFFF;border-radius:14px;padding:14px 16px;font-size:14px;font-weight:500;z-index:30}
.die{width:96px;height:96px;border-radius:24px;background:#F0954D;display:flex;align-items:center;justify-content:center;align-self:center;color:#1B1F27}
.done{opacity:.6;text-decoration:line-through}
.sw{font:inherit;width:52px;height:32px;border-radius:16px;border:0;background:#C9CED8;position:relative;cursor:pointer;flex:none}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:#FFFFFF;transition:left .15s}
.sw.on{background:#2F5BEA}
.sw.on::after{left:24px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.divider{height:1px;background:#E3E7EE}
.pos{color:#1F3FB0;font-weight:700}
.neg{color:#A3470D;font-weight:700}
.holi{display:flex;gap:12px;align-items:center}
.hdate{width:48px;height:52px;border-radius:12px;background:#1B1F27;color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.hdate span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#C3C8D2}
.hdate b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:20px}
.hand{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
.pc{font:inherit;flex:0 0 112px;height:156px;border-radius:16px;border:3px solid #C9CED8;background:#F6F7F9;padding:10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;color:#1B1F27;box-sizing:border-box;transition:transform .15s}
.pc i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#565D6C}
.pc .gl{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:34px;font-weight:800;line-height:1;color:#3A4150}
.pc b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:15px;line-height:1.1}
.pc .ds{font-size:13px;line-height:1.35;color:#2C313B}
.pc.rare{background:#EAF0FF;border-color:#5B7BEA}
.pc.rare i,.pc.rare .gl{color:#1F3FB0}
.pc.legendary{background:#FFF3DA;border-color:#C7891A;box-shadow:0 0 0 2px #FFE2A6,0 6px 18px rgba(199,137,26,.35)}
.pc.legendary i,.pc.legendary .gl{color:#7A4F00}
.pc.treat{background:#FFEFF3}
.pc.treat.rare{background:#F4EDFF}
.pc.treat.legendary{background:#FFF0E0}
.pc.treat i{color:#8E2A4F}
.pc.treat .gl{font-size:30px;color:#8E2A4F}
.pc.treat.rare i,.pc.treat.rare .gl{color:#5B2BA8}
.pc.treat.legendary i,.pc.treat.legendary .gl{color:#7A4F00}
.pc.on{transform:translateY(-6px);outline:3px solid #1B1F27;outline-offset:2px}
.pc.big{flex:none;width:100%;height:auto;min-height:200px;gap:8px;cursor:default}
.pc.big .gl{font-size:44px}
.pc.big b{font-size:18px}
.pc.ghost{background:#E9EBEF;border-style:dashed;border-color:#B5BBC6;box-shadow:none}
.pc.ghost .gl,.pc.ghost b{color:#8E95A2}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.colgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.colgrid .pc{flex:none;width:100%;height:128px;cursor:default}
.colgrid .pc .gl{font-size:26px}
.colgrid .pc b{font-size:13px}
.revealbox{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;padding:0 48px;box-sizing:border-box}
.revealcard{width:230px;min-height:310px;animation:flipin .65s ease-out}
.revealcard .gl{font-size:64px}
@keyframes flipin{0%{transform:perspective(800px) rotateY(90deg) scale(.7);opacity:0}60%{transform:perspective(800px) rotateY(-12deg) scale(1.04);opacity:1}100%{transform:perspective(800px) rotateY(0) scale(1)}}
.overlay.center{align-items:center;justify-content:center}
.raretag{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:24px;font-weight:800;color:#FFFFFF;text-align:center}
.notice{background:#FFFFFF;border:2px solid #1B1F27;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tlink{font:inherit;background:none;border:0;padding:2px 0;text-align:left;font-size:17px;font-weight:700;color:#1B1F27;cursor:pointer;text-decoration:underline;text-decoration-color:#C9CED8;text-decoration-thickness:2px;text-underline-offset:4px}
.tlink.sm{font-size:14px;font-weight:500;color:#3A4150}
.cm{background:#F1F3F6;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;max-width:85%;align-self:flex-start}
.cm.mine{background:#DCE6FF;align-self:flex-end}
.nt{font:inherit;text-align:left;background:#FFFFFF;border:0;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;color:#1B1F27;width:100%;box-sizing:border-box}
.nt .ndot{width:10px;height:10px;border-radius:5px;background:transparent;flex:none;margin-top:6px}
.nt.unread{box-shadow:0 0 0 2px #C9D6FF}
.nt.unread .ndot{background:#2F5BEA}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.filters .cbtn{flex:none}
.sel{font:inherit;font-size:14px;min-height:40px;padding:0 10px;border-radius:12px;border:2px solid #D3D8E1;background:#FFFFFF;color:#1B1F27}
.playbar{background:#1B1F27;color:#FFFFFF;border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:#E3E7EE}
.ph{border-radius:12px;background:#E3E7EE;color:#6B7280;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;aspect-ratio:1/1;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ph em{position:absolute;left:6px;top:6px;font-style:normal;font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:rgba(27,31,39,.8);color:#FFFFFF;padding:2px 6px;border-radius:6px;z-index:1}
.photolbl{cursor:pointer}
.hidefile{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.plan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:78px;gap:4px;background:#1B1F27;padding:4px;border-radius:14px}
.room{position:relative;background:#F6F7F9;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
.room .rf{position:absolute;left:0;right:0;bottom:0;background:#9ED4B4}
.room b{position:relative;font-size:13px}
.room span{position:relative;font-size:11px;color:#2C313B}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ach{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;background:#F1F3F6;color:#6B7280}
.ach b{font-size:14px}
.ach span{font-size:12px;line-height:1.3}
.ach.got{background:#FFE7CF;color:#5E2A06}
.trophy{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.overlay{position:absolute;inset:0;background:rgba(27,31,39,.55);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#FFFFFF;width:100%;border-radius:24px 24px 0 0;padding:20px 16px 32px;display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto;box-sizing:border-box}
.stat{background:#F1F3F6;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
</style>

<style>
html,body{margin:0;background:#D9DDE3}
#root{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;box-sizing:border-box}

<style>
/* ---- Login gate ---- */
.hqlogin{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#2F5BEA,#1B2E7A);display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:'DM Sans',system-ui,sans-serif}
.hqlogin[hidden]{display:none}
.hqlogin-card{background:#fff;border-radius:24px;padding:26px 22px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(13,22,70,.4)}
.hqlogo{width:64px;height:64px;align-self:center}
.hqtitle{font-size:28px;font-weight:800;text-align:center;color:#1B1F27}
.hqsub{margin:0;text-align:center;color:#565D6C;font-size:14px;line-height:1.4}
.hqwho{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hqwhobtn{font:inherit;font-weight:700;font-size:16px;min-height:52px;border-radius:14px;border:2px solid #D3D8E1;background:#fff;color:#1B1F27;cursor:pointer}
.hqwhobtn.on{border-color:#2F5BEA;background:#EEF3FF;color:#1F3FB0}
.hqhint{margin:0;font-size:12px;color:#5A6170;text-align:center}
.hqerr{margin:0;color:#B8520F;font-size:14px;font-weight:600;text-align:center;min-height:18px}

/* ---- Natural-scroll shell (matches the Almanac; robust on iOS standalone) ----
   The prototype was a fixed 390x844 frame with an inner scroll, which fights iOS
   standalone's viewport (innerHeight is reported short of the physical screen, so
   the shell can't reach the bottom). Convert to the proven pattern: the document
   scrolls, the header is sticky, the tab bar is fixed to the bottom, and content
   is padded so it clears the tab bar. */
html,body{margin:0;min-height:100%;overscroll-behavior-y:none}
#root{display:block !important;min-height:100vh;padding:0 !important}
.dc-root{border-radius:0 !important;box-shadow:none !important}
.app{width:auto !important;height:auto !important;min-height:100vh;max-width:520px;margin:0 auto;overflow:visible !important;position:static !important;display:block !important}

/* Sticky header — stays put while the page scrolls under it. */
.app > .row.between:first-child{position:sticky;top:0;z-index:40;background:#EEF0F3;padding-top:calc(12px + env(safe-area-inset-top)) !important;padding-bottom:8px !important}

/* The view flows in the document (no inner scroller); pad the bottom to clear the fixed nav. */
.scroll{display:flex;flex-direction:column;gap:14px;flex:none !important;overflow:visible !important;min-height:0;padding:12px 16px calc(88px + env(safe-area-inset-bottom)) !important}

/* Fixed bottom nav, pinned to the true screen bottom (iOS handles this correctly
   in natural-scroll mode, unlike the fixed-frame/overflow:hidden model). */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:520px;margin:0 auto;padding:6px 4px calc(10px + env(safe-area-inset-bottom)) !important}

/* Overlays/sheets/toast anchor to the viewport, not the (now tall) document. */
.overlay{position:fixed !important}
.sheet{padding-bottom:calc(32px + env(safe-area-inset-bottom)) !important}
.toast{position:fixed !important;top:calc(64px + env(safe-area-inset-top)) !important}

/* Horizontal strips only pan sideways, so a vertical swipe still scrolls the page. */
.filters,.hand{touch-action:pan-x}
.hqlogin{padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}

/* Accessibility: visible keyboard focus + respect reduced-motion (the card-reveal
   flip is a large 3D animation — a real vestibular concern). */
:focus-visible{outline:3px solid #2F5BEA;outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .revealcard{animation:none !important}
}

/* ---- Dark theme (resolved to an explicit data-theme by app.js) ---- */
:root[data-theme="dark"] .app{background:#14161b;color:#eceef2}
:root[data-theme="dark"] .app > .row.between:first-child{background:#14161b}
:root[data-theme="dark"] body{background:#14161b}
:root[data-theme="dark"] .card{background:#1f232b;box-shadow:0 1px 0 rgba(0,0,0,.4)}
:root[data-theme="dark"] .card.target{box-shadow:0 0 0 3px #E08A45}
:root[data-theme="dark"] .lbl{color:#9aa3b2}
:root[data-theme="dark"] .mini,:root[data-theme="dark"] .fbtn span{color:#9aa3b2}
:root[data-theme="dark"] .inp,:root[data-theme="dark"] .vbtn,:root[data-theme="dark"] .cbtn,:root[data-theme="dark"] .fbtn,:root[data-theme="dark"] .sel{background:#262b34;border-color:#39414e;color:#eceef2}
:root[data-theme="dark"] .fbtn.on{background:#1b2740;border-color:#2F5BEA}
:root[data-theme="dark"] .cbtn.on{background:#eceef2;border-color:#eceef2;color:#14161b}
:root[data-theme="dark"] .vbtn.on{background:#2F5BEA;border-color:#2F5BEA;color:#fff}
:root[data-theme="dark"] .chip{background:#2a2f39;color:#c7cedb}
:root[data-theme="dark"] .btn{background:#2a2f39;color:#eceef2}
:root[data-theme="dark"] .btn.pri{background:#2F5BEA;color:#fff}
:root[data-theme="dark"] .btn.warm{background:#B8520F;color:#fff}
:root[data-theme="dark"] .btn.ghost{background:transparent;color:#aeb6c4}
:root[data-theme="dark"] .iconbtn{color:#eceef2}
:root[data-theme="dark"] .iconbtn.on{background:#2a2f39}
:root[data-theme="dark"] .tabs{background:#1f232b;border-top-color:#2a2f39}
:root[data-theme="dark"] .tab{color:#8b93a2}
:root[data-theme="dark"] .tab.on{color:#7C9BFF}
:root[data-theme="dark"] .seg{background:#2a2f39}
:root[data-theme="dark"] .sbtn{color:#c7cedb}
:root[data-theme="dark"] .sbtn.on{background:#14161b;color:#eceef2}
:root[data-theme="dark"] .divider{background:#2a2f39}
:root[data-theme="dark"] .meter{background:#343a47}
:root[data-theme="dark"] .cm{background:#262b34}
:root[data-theme="dark"] .cm.mine{background:#1b2740}
:root[data-theme="dark"] .ph{background:#2a2f39;color:#9aa3b2}
:root[data-theme="dark"] .nt{background:#1f232b;color:#eceef2}
:root[data-theme="dark"] .notice{background:#1f232b;border-color:#eceef2}
:root[data-theme="dark"] .tlink{color:#eceef2;text-decoration-color:#39414e}
:root[data-theme="dark"] .stat,:root[data-theme="dark"] .ach{background:#262b34}
:root[data-theme="dark"] .room{background:#262b34}
:root[data-theme="dark"] .sheet{background:#1f232b;color:#eceef2}
:root[data-theme="dark"] .pc{background:#262b34;border-color:#39414e;color:#eceef2}
:root[data-theme="dark"] .pc .gl,:root[data-theme="dark"] .pc i{color:#9aa3b2}
:root[data-theme="dark"] .pc.ghost{background:#20242c}
:root[data-theme="dark"] a{color:#7C9BFF}
</style>
</head>
<body>
<div id="login" class="hqlogin">
  <div class="hqlogin-card">
    <img class="hqlogo" src="/house-quest/icons/house-quest-icon-square.svg" alt="House Quest">
    <div class="disp hqtitle">House Quest</div>
    <p class="hqsub">Plan, budget and build the house — together.</p>
    <div class="field"><span class="flabel">Who are you?</span>
      <div class="hqwho">
        <button type="button" class="hqwhobtn" data-user="david">David</button>
        <button type="button" class="hqwhobtn" data-user="anne">Anne</button>
      </div>
    </div>
    <div class="field"><label for="hq-pass">Passcode</label>
      <input id="hq-pass" class="inp" type="password" inputmode="numeric" placeholder="Your passcode" autocomplete="current-password">
    </div>
    <p class="hqhint">First time signing in? Whatever you type becomes your passcode.</p>
    <button id="hq-login" class="btn pri full">Continue</button>
    <p id="hq-err" class="hqerr" role="alert"></p>
  </div>
</div>
<div id="root"></div>
<template id="dc-template">


<div class="app">
  <div class="row between" style="padding: 12px 8px 4px 16px; gap: 6px">
    <div class="disp" style="font-size: 20px; font-weight: 800">House Quest</div>
    <div class="row" style="gap: 4px">
      <div class="seg" role="group" aria-label="Signed in">
        <button class="sbtn on">{{me}}</button>
        <button class="sbtn" onClick="{{signOut}}">Sign out</button>
      </div>
      <button class="{{bellCls}}" onClick="{{goInbox}}" aria-label="Notifications, {{unread}} unread" style="position: relative">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg>
        <sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><span class="badge" style="top: 2px; right: 2px">{{unread}}</span></sc-if>
      </button>
      <button class="{{gearCls}}" onClick="{{goSettings}}" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
      </button>
    </div>
  </div>

  <sc-if value="{{playing}}" hint-placeholder-val="{{ false }}">
    <div style="padding: 4px 16px 0">
      <div class="playbar">
        <span>{{playHint}}</span>
        <button class="btn sm" onClick="{{cancelPlay}}">Cancel</button>
      </div>
    </div>
  </sc-if>

  <!-- BOARD -->
  <sc-if value="{{isBoard}}" hint-placeholder-val="{{ true }}">
    <div class="scroll">
      <div class="card dark">
        <div class="row between">
          <span class="lbl">In-game balance</span>
          <span class="mini" style="color: #A9B0BE">Next deposit {{nextDeposit}}</span>
        </div>
        <span class="disp" style="font-size: 44px; font-weight: 800; line-height: 1; color: {{balColor}}">{{balanceFmt}}</span>
        <sc-if value="{{inRed}}" hint-placeholder-val="{{ false }}"><span class="chip later" style="align-self: flex-start">In the red until {{nextDepositDate}}</span></sc-if>
        <div class="row between">
          <span class="mini" style="color: #C3C8D2">Set aside {{reservedFmt}}</span>
          <span style="font-size: 14px; font-weight: 700">Free to spend {{availableFmt}}</span>
        </div>
      </div>

      <sc-if value="{{hasDrop}}" hint-placeholder-val="{{ true }}">
        <div class="card drop">
          <span class="lbl" style="color: #8A3E0B">Surprise cash drop</span>
          <span style="font-size: 16px; font-weight: 500; line-height: 1.4">{{dropText}}</span>
          <button class="btn warm full" onClick="{{claimDrop}}">Claim {{dropAmtFmt}}</button>
        </div>
      </sc-if>

      <sc-if value="{{drOpen}}" hint-placeholder-val="{{ true }}">
        <div class="card" style="gap: 8px; box-shadow: 0 0 0 3px #2F5BEA">
          <span class="lbl" style="color: #1F3FB0">This week's draft is open</span>
          <span style="font-size: 16px; font-weight: 500; line-height: 1.4">{{drBanner}}</span>
          <button class="btn pri full" onClick="{{goDraft}}">{{drCta}}</button>
        </div>
      </sc-if>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div class="row between" style="padding: 0 2px">
          <span class="lbl">{{me}}'s hand · {{handCount}}/{{maxHand}}</span>
          <button class="btn ghost sm" onClick="{{goCards}}">All cards</button>
        </div>
        <div class="hand">
          <sc-for list="{{hand}}" as="c" hint-placeholder-count="2">
            <button class="{{c.cls}}" onClick="{{c.pick}}" aria-label="{{c.name}}: {{c.desc}}">
              <i>{{c.rarity}}</i>
              <span class="gl">{{c.glyph}}</span>
              <b>{{c.name}}</b>
            </button>
          </sc-for>
          <sc-if value="{{handEmpty}}" hint-placeholder-val="{{ false }}">
            <span class="mini" style="padding: 8px 2px">No cards yet. Finish upgrades and level up to draw more.</span>
          </sc-if>
        </div>
      </div>

      <sc-if value="{{hasNotice}}" hint-placeholder-val="{{ false }}">
        <div class="notice">
          <span style="font-size: 15px; font-weight: 500; line-height: 1.4">{{noticeText}}</span>
          <div class="row">
            <sc-if value="{{canBlockNotice}}" hint-placeholder-val="{{ false }}">
              <button class="btn warm sm" onClick="{{blockNotice}}">Block it</button>
            </sc-if>
            <button class="btn sm" onClick="{{dismissNotice}}">Fair enough</button>
          </div>
        </div>
      </sc-if>

      <div class="card">
        <div class="row between">
          <span class="lbl">House level {{level}} · {{levelName}}</span>
          <span class="mini">{{xp}} XP</span>
        </div>
        <div class="meter"><div class="fill xp" style="width: {{xpPct}}%"></div></div>
        <span class="mini">{{xpToNext}} XP to level {{nextLevel}}. Level-ups draw a card for each of you.</span>
      </div>

      <div class="row between" style="padding: 6px 2px 0">
        <span class="disp" style="font-size: 20px; font-weight: 800">Up next</span>
        <span class="mini">It's {{season}} · in-season jobs get +3</span>
      </div>
      <div class="filters" role="group" aria-label="Filter upgrades">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
          <button class="{{f.cls}}" onClick="{{f.pick}}">{{f.name}}</button>
        </sc-for>
      </div>
      <div class="row between" style="margin-top: -4px">
        <select class="sel" aria-label="Filter by room" value="{{roomFilter}}" onChange="{{setRoomFilter}}" data-opts="roomOpts"></select>
        <span class="mini">Showing {{shownCount}} of {{queueTotal}}</span>
      </div>

      <sc-for list="{{queue}}" as="it" hint-placeholder-count="3">
        <div class="{{it.cardCls}}">
          <div class="row between" style="align-items: flex-start">
            <div class="row" style="align-items: flex-start; gap: 12px">
              <sc-if value="{{it.hasBefore}}" hint-placeholder-val="{{ false }}">
                <img class="thumb" src="{{it.beforePhoto}}" alt="Before photo of {{it.title}}">
              </sc-if>
              <div class="col">
                <span class="mini">{{it.cat}} · {{it.fundLabel}}</span>
                <button class="tlink" onClick="{{it.open}}">{{it.title}}</button>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
              <span class="disp" style="font-size: 18px; font-weight: 800">{{it.costFmt}}</span>
              <span class="chip">{{it.effortLabel}}</span>
            </div>
          </div>
          <div class="row wrap">
            <span class="chip">{{it.whoLabel}}</span>
            <sc-if value="{{it.planned}}" hint-placeholder-val="{{ false }}"><span class="chip ready">In the plan</span></sc-if>
            <sc-if value="{{it.inSeason}}" hint-placeholder-val="{{ false }}"><span class="chip season">In season +3</span></sc-if>
            <sc-if value="{{it.hasLink}}" hint-placeholder-val="{{ false }}"><a class="chip link" href="{{it.link}}" target="_blank" rel="noopener">View item ↗</a></sc-if>
            <sc-for list="{{it.plays}}" as="p" hint-placeholder-count="1">
              <span class="chip boost">{{p.label}}</span>
            </sc-for>
          </div>
          <div class="row between">
            <div class="imp"><span>David <b>{{it.d}}</b></span><span>Anne <b>{{it.a}}</b></span><span>Score <b>{{it.score}}</b></span></div>
            <span class="{{it.fitCls}}">{{it.fitLabel}}</span>
          </div>

          <sc-if value="{{it.isLump}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <div class="row between"><span class="mini">Saved {{it.savedFmt}} of {{it.costFmt}}</span><span class="mini">{{it.savePct}}%</span></div>
              <div class="meter"><div class="fill save" style="width: {{it.savePct}}%"></div></div>
            </div>
            <div class="row">
              <button class="btn" style="flex: 1" onClick="{{it.setAside}}">Set aside $100</button>
              <button class="btn pri" style="flex: 1" onClick="{{it.startFinish}}">{{it.buyLabel}}</button>
            </div>
          </sc-if>

          <sc-if value="{{it.isGradual}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <div class="row between"><span class="mini">{{it.piecesDone}} of {{it.pieces}} {{it.unit}} done</span><span class="mini">{{it.perFmt}} each</span></div>
              <div class="meter"><div class="fill" style="width: {{it.piecePct}}%"></div></div>
            </div>
            <button class="btn pri full" onClick="{{it.doPiece}}">Do 1 more · {{it.perFmt}}</button>
          </sc-if>

          <div class="row between">
            <button class="btn ghost sm" onClick="{{it.shelve}}">Shelve</button>
            <sc-if value="{{it.canPlay}}" hint-placeholder-val="{{ false }}">
              <button class="btn warm sm" onClick="{{it.play}}">{{it.playLabel}}</button>
            </sc-if>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{queueEmpty}}" hint-placeholder-val="{{ false }}">
        <div class="card"><span class="mini">Nothing approved yet. Pitch an upgrade to get started.</span></div>
      </sc-if>
      <sc-if value="{{noMatch}}" hint-placeholder-val="{{ false }}">
        <div class="card"><span class="mini">Nothing matches that filter.</span></div>
      </sc-if>

      <sc-if value="{{hasShelf}}" hint-placeholder-val="{{ false }}">
        <span class="lbl" style="padding: 8px 2px 0">Shelf</span>
        <div class="card" style="gap: 4px">
          <sc-for list="{{shelf}}" as="it" hint-placeholder-count="1">
            <div class="row between">
              <button class="tlink sm" onClick="{{it.open}}">{{it.title}} · {{it.costFmt}}</button>
              <sc-if value="{{it.canRevive}}" hint-placeholder-val="{{ false }}">
                <button class="btn warm sm" onClick="{{it.revive}}">Play Second Chance</button>
              </sc-if>
              <sc-if value="{{it.plain}}" hint-placeholder-val="{{ true }}">
                <button class="btn ghost sm" onClick="{{it.restore}}">Restore</button>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <!-- PITCHES -->
  <sc-if value="{{isPitches}}" hint-placeholder-val="{{ false }}">
    <div class="scroll">
      <div class="h2">Needs your vote</div>
      <span class="mini" style="margin-top: -8px; padding: 0 2px">How important is this to you? Your partner's score stays hidden until you lock in.</span>
      <sc-for list="{{toVote}}" as="it" hint-placeholder-count="1">
        <div class="card">
          <div class="row" style="align-items: flex-start; gap: 12px">
            <sc-if value="{{it.hasBefore}}" hint-placeholder-val="{{ false }}">
              <img class="thumb" src="{{it.beforePhoto}}" alt="Photo for {{it.title}}">
            </sc-if>
            <div class="col" style="flex: 1">
              <span class="mini">{{it.by}} pitched · {{it.cat}}</span>
              <button class="tlink" onClick="{{it.open}}">{{it.title}}</button>
            </div>
            <span class="disp" style="font-size: 18px; font-weight: 800">{{it.costFmt}}</span>
          </div>
          <div class="row wrap">
            <span class="chip">{{it.fundLabel}}</span>
            <span class="chip">{{it.effortLabel}}</span>
            <span class="chip">{{it.whoLabel}}</span>
            <sc-if value="{{it.hasSeason}}" hint-placeholder-val="{{ false }}"><span class="chip season">Best in {{it.season}}</span></sc-if>
            <sc-if value="{{it.hasLink}}" hint-placeholder-val="{{ false }}"><a class="chip link" href="{{it.link}}" target="_blank" rel="noopener">View item ↗</a></sc-if>
          </div>
          <sc-if value="{{it.hasNote}}" hint-placeholder-val="{{ false }}">
            <span class="mini" style="font-style: italic">"{{it.note}}"</span>
          </sc-if>
          <sc-if value="{{it.peeked}}" hint-placeholder-val="{{ false }}">
            <span class="chip boost" style="align-self: flex-start">Peek: {{other}} rated it {{it.partnerVote}}</span>
          </sc-if>
          <sc-if value="{{it.canPeek}}" hint-placeholder-val="{{ false }}">
            <button class="btn warm sm" onClick="{{it.peek}}">Play Peek here</button>
          </sc-if>
          <div class="row between"><span class="mini">Not a big deal</span><span class="mini">Must have</span></div>
          <div class="vote">
            <sc-for list="{{it.votes}}" as="v" hint-placeholder-count="5">
              <button class="{{v.cls}}" onClick="{{v.pick}}" aria-label="Importance {{v.n}}">{{v.n}}</button>
            </sc-for>
          </div>
          <div class="row">
            <button class="btn pri" style="flex: 1" onClick="{{it.lockIn}}">Lock in vote</button>
            <button class="btn" onClick="{{it.pass}}">Pass</button>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{noVotes}}" hint-placeholder-val="{{ false }}">
        <div class="card"><span class="mini">You're all caught up.</span></div>
      </sc-if>

      <span class="lbl" style="padding: 10px 2px 0">Waiting on {{other}}</span>
      <sc-for list="{{waiting}}" as="it" hint-placeholder-count="1">
        <div class="card" style="flex-direction: row; justify-content: space-between; align-items: center">
          <div class="col" style="gap: 2px">
            <button class="tlink" style="font-size: 15px" onClick="{{it.open}}">{{it.title}}</button>
            <span class="mini">{{it.cat}} · {{it.costFmt}} · you said {{it.mine}}</span>
          </div>
          <sc-if value="{{it.canOverride}}" hint-placeholder-val="{{ false }}">
            <button class="btn warm sm" onClick="{{it.override}}">Play here</button>
          </sc-if>
          <sc-if value="{{it.noOverride}}" hint-placeholder-val="{{ true }}">
            <button class="btn ghost sm" onClick="{{it.withdraw}}">Withdraw</button>
          </sc-if>
        </div>
      </sc-for>
      <sc-if value="{{noWaiting}}" hint-placeholder-val="{{ false }}">
        <span class="mini" style="padding: 0 2px">Nothing pending with {{other}}.</span>
      </sc-if>
    </div>
  </sc-if>

  <!-- ADD -->
  <sc-if value="{{isAdd}}" hint-placeholder-val="{{ false }}">
    <div class="scroll">
      <div class="h2">Pitch an upgrade</div>
      <div class="card" style="gap: 16px">
        <div class="field">
          <label for="f-title">What's the upgrade?</label>
          <input id="f-title" class="inp" placeholder="e.g. Ceiling fan in office" value="{{fTitle}}" onChange="{{setTitle}}">
        </div>
        <div class="row" style="align-items: center; gap: 12px">
          <sc-if value="{{fHasPhoto}}" hint-placeholder-val="{{ false }}">
            <img class="thumb" src="{{fPhoto}}" alt="Before photo">
          </sc-if>
          <label class="btn sm photolbl">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
            {{fPhotoLabel}}
            <input class="hidefile" type="file" accept="image/*" onChange="{{setFPhoto}}">
          </label>
        </div>
        <div class="field">
          <span class="flabel">How does it get paid for?</span>
          <div class="fund">
            <button class="{{fundLumpCls}}" onClick="{{pickLump}}"><b>All at once</b><span>Save up, then buy. A couch, an appliance.</span></button>
            <button class="{{fundGradCls}}" onClick="{{pickGrad}}"><b>Bit by bit</b><span>Do a piece whenever there's money. Light switches, plants.</span></button>
          </div>
        </div>
        <div class="field">
          <label for="f-cost">Total estimated cost ($, 0 is fine)</label>
          <input id="f-cost" class="inp" inputmode="decimal" placeholder="0" value="{{fCost}}" onChange="{{setCost}}">
        </div>
        <sc-if value="{{fIsGrad}}" hint-placeholder-val="{{ false }}">
          <div class="row" style="align-items: flex-end">
            <div class="field" style="flex: 0 0 100px">
              <label for="f-pieces">How many</label>
              <input id="f-pieces" class="inp" inputmode="numeric" value="{{fPieces}}" onChange="{{setPieces}}">
            </div>
            <div class="field" style="flex: 1">
              <label for="f-unit">Of what</label>
              <input id="f-unit" class="inp" placeholder="switches" value="{{fUnit}}" onChange="{{setUnit}}">
            </div>
          </div>
          <span class="mini">About {{fPerFmt}} per piece</span>
        </sc-if>
        <div class="field">
          <label for="f-link">Product link (optional)</label>
          <input id="f-link" class="inp" inputmode="url" placeholder="Paste the exact one you mean" value="{{fLink}}" onChange="{{setLink}}">
        </div>
        <div class="field">
          <span class="flabel">How much work is it?</span>
          <div class="vote v3">
            <sc-for list="{{effortOpts}}" as="e" hint-placeholder-count="3">
              <button class="{{e.cls}}" onClick="{{e.pick}}">{{e.name}}</button>
            </sc-for>
          </div>
        </div>
        <div class="field">
          <span class="flabel">Who's doing it?</span>
          <div class="vote v4">
            <sc-for list="{{whoOpts}}" as="e" hint-placeholder-count="4">
              <button class="{{e.cls}}" onClick="{{e.pick}}">{{e.name}}</button>
            </sc-for>
          </div>
        </div>
        <div class="field">
          <span class="flabel">Best time of year</span>
          <div class="catgrid">
            <sc-for list="{{seasonOpts}}" as="c" hint-placeholder-count="5">
              <button class="{{c.cls}}" onClick="{{c.pick}}">{{c.name}}</button>
            </sc-for>
          </div>
        </div>
        <div class="field">
          <span class="flabel">Category</span>
          <div class="catgrid">
            <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
              <button class="{{c.cls}}" onClick="{{c.pick}}">{{c.name}}</button>
            </sc-for>
          </div>
          <div class="row" style="margin-top: 4px">
            <input class="inp" aria-label="New category" placeholder="New category" value="{{fNewCat}}" onChange="{{setNewCat}}">
            <button class="btn" onClick="{{addCat}}">Add</button>
          </div>
        </div>
        <div class="field">
          <span class="flabel">How important is it to you?</span>
          <div class="vote">
            <sc-for list="{{myVote}}" as="v" hint-placeholder-count="5">
              <button class="{{v.cls}}" onClick="{{v.pick}}" aria-label="Importance {{v.n}}">{{v.n}}</button>
            </sc-for>
          </div>
        </div>
        <div class="field">
          <label for="f-note">Sell it (optional)</label>
          <input id="f-note" class="inp" placeholder="Why it matters" value="{{fNote}}" onChange="{{setNote}}">
        </div>
        <button class="btn pri full" onClick="{{submit}}">Send to {{other}}</button>
      </div>
    </div>
  </sc-if>

  <!-- TROPHIES -->
  <sc-if value="{{isTrophies}}" hint-placeholder-val="{{ false }}">
    <div class="scroll">
      <div class="h2">Trophies</div>

      <button class="btn warm full" onClick="{{openRecap}}">See this week's wrap-up</button>

      <span class="lbl" style="padding: 4px 2px 0">The house</span>
      <div class="plan" role="img" aria-label="Floor plan showing progress by room">
        <sc-for list="{{rooms}}" as="r" hint-placeholder-count="9">
          <div class="room" style="grid-column: span {{r.span}}">
            <div class="rf" style="height: {{r.pct}}%"></div>
            <b>{{r.name}}</b>
            <span>{{r.label}}</span>
          </div>
        </sc-for>
      </div>
      <span class="mini" style="padding: 0 2px; margin-top: -6px">Rooms fill in as you finish upgrades in them.</span>

      <div class="row between" style="padding: 8px 2px 0">
        <span class="lbl">Achievements</span>
        <span class="mini">{{achGot}} of {{achTotal}}</span>
      </div>
      <div class="badges">
        <sc-for list="{{achievements}}" as="a" hint-placeholder-count="8">
          <div class="{{a.cls}}">
            <b>{{a.name}}</b>
            <span>{{a.desc}}</span>
          </div>
        </sc-for>
      </div>

      <span class="lbl" style="padding: 8px 2px 0">Estimating skills</span>
      <div class="card">
        <div class="row between">
          <span style="font-weight: 700">{{estHeadline}}</span>
          <span class="{{estCls}}">{{estDiffFmt}}</span>
        </div>
        <span class="mini">Estimated {{estTotalFmt}}, actually spent {{actTotalFmt}} across {{estCount}} finished jobs. Coming in under refunds the difference as a bonus.</span>
      </div>

      <span class="lbl" style="padding: 8px 2px 0">Trophy wall</span>
      <sc-for list="{{trophies}}" as="t" hint-placeholder-count="2">
        <div class="card">
          <div class="row between">
            <div class="col" style="gap: 2px">
              <button class="tlink" style="font-size: 15px" onClick="{{t.open}}">{{t.title}}</button>
              <span class="mini">{{t.doneMonth}} · {{t.whoLabel}} · {{t.actualFmt}}</span>
            </div>
            <span class="{{t.diffCls}}">{{t.diffFmt}}</span>
          </div>
          <div class="trophy">
            <label class="ph photolbl">
              <em>Before</em>
              <sc-if value="{{t.hasBefore}}" hint-placeholder-val="{{ false }}"><img src="{{t.beforePhoto}}" alt="Before"></sc-if>
              <sc-if value="{{t.noBefore}}" hint-placeholder-val="{{ true }}"><span>+ Add photo</span></sc-if>
              <input class="hidefile" type="file" accept="image/*" onChange="{{t.setBefore}}">
            </label>
            <label class="ph photolbl">
              <em>After</em>
              <sc-if value="{{t.hasAfter}}" hint-placeholder-val="{{ false }}"><img src="{{t.afterPhoto}}" alt="After"></sc-if>
              <sc-if value="{{t.noAfter}}" hint-placeholder-val="{{ true }}"><span>+ Add photo</span></sc-if>

  <!-- SETTINGS -->

              <button class="{{f.cls}}" onClick="{{f.pick}}">{{f.n}}</button>
            </sc-for>
          </div>
        </div>
      </div>

      <div class="card" style="gap: 10px">
        <span class="lbl">Treat cards</span>
        <div class="setrow">
          <div class="col" style="gap: 2px">
            <span style="font-weight: 700">Treats in the deck</span>
            <span class="mini">Real-life rewards like a charcuterie night or a bottle of wine</span>
          </div>
          <button class="{{treatsCls}}" onClick="{{toggleTreats}}" aria-pressed="{{treatsOn}}" aria-label="Treats in the deck"></button>

        <div class="divider"></div>
        <span style="font-weight: 700">Make your own</span>

          <div class="field" style="flex: 0 0 110px"><label for="ct-glyph">Card word</label><input id="ct-glyph" class="inp" placeholder="Pizza" maxlength="5" value="{{ctGlyph}}" onChange="{{setCtGlyph}}"></div>

      </div>
      <div class="card dark" style="gap: 8px">

          <span class="lbl">Left to allocate</span>

        <div class="meter"><div class="fill" style="width: {{drUsedPct}}%"></div></div>
        <span style="font-size: 15px; font-weight: 700">{{drStatus}}</span>
      </div>

          <sc-if value="{{o.showCap}}" hint-placeholder-val="{{ false }}"><span class="mini">Would get {{o.amtFmt}}</span></sc-if>

          <div class="divider"></div>
          <div class="row between"><span style="font-weight: 700">Total planned</span><span style="font-weight: 700">{{drPickedFmt}}</span></div>

    <div class="scroll">
      <div class="row between" style="padding: 6px 2px 0">
        <span class="disp" style="font-size: 20px; font-weight: 800">{{me}}'s cards</span>
        <button class="btn ghost sm" onClick="{{goBoard}}">Done</button>
      </div>
      <div class="cgrid">
        <sc-for list="{{hand}}" as="c" hint-placeholder-count="2">
          <div class="{{c.bigCls}}">
            <i>{{c.rarity}}</i>
            <span class="gl">{{c.glyph}}</span>
            <b>{{c.name}}</b>
            <span class="ds">{{c.desc}}</span>
            <sc-if value="{{c.isTreat}}" hint-placeholder-val="{{ false }}"><span class="chip" style="align-self: flex-start">{{c.valueLabel}}</span></sc-if>
            <button class="btn sm" style="background: #1B1F27; color: #FFFFFF" onClick="{{c.use}}">{{c.useLabel}}</button>
            <sc-if value="{{c.isTreat}}" hint-placeholder-val="{{ false }}">
              <button class="btn sm" style="background: #FFFFFF; border: 2px solid #1B1F27" onClick="{{c.cashOut}}">{{c.cashLabel}}</button>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{handEmpty}}" hint-placeholder-val="{{ false }}">
        <div class="card"><span class="mini">Your hand is empty. Finish an upgrade to draw.</span></div>
      </sc-if>

      <sc-if value="{{hasArmed}}" hint-placeholder-val="{{ false }}">
        <span class="lbl" style="padding: 4px 2px 0">Armed</span>
        <div class="card" style="gap: 6px">
          <sc-for list="{{armed}}" as="a" hint-placeholder-count="1">
            <div class="row between"><span style="font-weight: 700">{{a.name}}</span><span class="mini">{{a.desc}}</span></div>
          </sc-for>
        </div>
      </sc-if>

      <span class="lbl" style="padding: 4px 2px 0">Card log</span>
      <div class="card" style="gap: 8px">
        <sc-for list="{{cardLog}}" as="l" hint-placeholder-count="2">
          <span style="font-size: 14px; line-height: 1.4">{{l.text}}</span>
        </sc-for>
        <sc-if value="{{noLog}}" hint-placeholder-val="{{ false }}"><span class="mini">No cards played yet.</span></sc-if>
      </div>

      <div class="row between" style="padding: 4px 2px 0">
        <span class="lbl">Collection</span>
        <span class="mini">{{seenCount}} of {{deckSize}} discovered</span>
      </div>
      <div class="colgrid">
        <sc-for list="{{collection}}" as="k" hint-placeholder-count="12">
          <div class="{{k.cls}}">
            <div class="row between"><i>{{k.rarity}}</i><i>{{k.count}}</i></div>
            <span class="gl">{{k.glyph}}</span>
            <b>{{k.name}}</b>
          </div>
        </sc-for>
      </div>
      <span class="mini" style="padding: 0 2px">Draw odds: 60% common · 30% rare · 10% legendary.</span>
    </div>
  </sc-if>

  <!-- CARD REVEAL -->
  <sc-if value="{{hasReveal}}" hint-placeholder-val="{{ false }}">
    <div class="overlay center">
      <div class="revealbox">
        <span class="raretag">{{revealTag}}</span>
        <div class="{{revealCls}}">
          <i>{{revealRarity}}</i>
          <span class="gl">{{revealGlyph}}</span>
          <b>{{revealName}}</b>
          <span class="ds">{{revealDesc}}</span>
        </div>
        <button class="btn pri full" onClick="{{closeReveal}}">Add to hand</button>
      </div>
    </div>
  </sc-if>

  <!-- FINISH SHEET -->
  <sc-if value="{{finishing}}" hint-placeholder-val="{{ false }}">
    <div class="overlay">
      <div class="sheet" role="dialog" aria-label="Finish upgrade">
        <div class="col" style="gap: 2px">
          <span class="lbl">{{finLabel}}</span>
          <span class="disp" style="font-size: 22px; font-weight: 800">{{finTitle}}</span>
        </div>
        <div class="field">
          <label for="fin-actual">What did it actually cost? (estimate {{finEstFmt}})</label>
          <input id="fin-actual" class="inp" inputmode="decimal" value="{{finActual}}" onChange="{{setFinActual}}">
          <span class="{{finDiffCls}}">{{finDiffText}}</span>
          <sc-if value="{{finRed}}" hint-placeholder-val="{{ false }}"><span class="neg">{{finRedText}}</span></sc-if>
        </div>
        <div class="field">
          <span class="flabel">After photo for the trophy wall</span>
          <div class="trophy">
            <div class="ph">
              <em>Before</em>
              <sc-if value="{{finHasBefore}}" hint-placeholder-val="{{ false }}"><img src="{{finBefore}}" alt="Before"></sc-if>
              <sc-if value="{{finNoBefore}}" hint-placeholder-val="{{ true }}"><span>No photo</span></sc-if>
            </div>
            <label class="ph photolbl">
              <em>After</em>
              <sc-if value="{{finHasAfter}}" hint-placeholder-val="{{ false }}"><img src="{{finAfter}}" alt="After"></sc-if>
              <sc-if value="{{finNoAfter}}" hint-placeholder-val="{{ true }}"><span>+ Add photo</span></sc-if>
              <input class="hidefile" type="file" accept="image/*" onChange="{{setFinAfter}}">
            </label>
          </div>
        </div>
        <button class="btn pri full" onClick="{{confirmFinish}}">{{finBtn}}</button>
        <button class="btn ghost full" onClick="{{cancelFinish}}">Not yet</button>
      </div>
    </div>
  </sc-if>

  <!-- MONTHLY RECAP -->
  <sc-if value="{{showRecap}}" hint-placeholder-val="{{ false }}">
    <div class="overlay">
      <div class="sheet" role="dialog" aria-label="Monthly wrap-up">
        <div class="col" style="gap: 2px">
          <span class="lbl">Weekly wrap-up</span>
          <span class="disp" style="font-size: 26px; font-weight: 800">This week at the house</span>
        </div>
        <div class="stats">
          <div class="stat"><span class="mini">Finished</span><b>{{rcDone}}</b></div>
          <div class="stat"><span class="mini">Spent</span><b>{{rcSpent}}</b></div>
          <div class="stat"><span class="mini">XP earned</span><b>{{xp}}</b></div>
          <div class="stat"><span class="mini">Bonus money</span><b>{{rcBonus}}</b></div>
        </div>
        <div class="col" style="gap: 6px">
          <span class="lbl">Best excuse for free money</span>
          <span style="font-size: 15px; line-height: 1.4">{{rcBestDrop}}</span>
        </div>
        <div class="row between">
          <span class="lbl">Cards played</span>
          <span style="font-size: 14px">David {{rcCardsD}} · Anne {{rcCardsA}}</span>
        </div>
        <div class="row between">
          <span class="lbl">Estimates</span>
          <span class="{{estCls}}">{{estHeadline}}</span>
        </div>
        <div class="card dark" style="gap: 4px">
          <span class="lbl">Coming up</span>
          <span style="font-size: 15px">{{budgetFmt}} lands {{nextDepositDate}}. Top of the list: {{rcTop}}.</span>
        </div>
        <button class="btn pri full" onClick="{{closeRecap}}">Bring on next week</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div class="toast" role="status">{{toast}}</div>
  </sc-if>

  <nav class="tabs" aria-label="Main">
    <button class="{{tabCls.board}}" onClick="{{goBoard}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
      Board
    </button>
    <button class="{{tabCls.pitches}}" onClick="{{goPitches}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      Pitches
      <sc-if value="{{hasBadge}}" hint-placeholder-val="{{ true }}"><span class="badge">{{badge}}</span></sc-if>
    </button>
    <button class="{{tabCls.add}}" onClick="{{goAdd}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>
      Pitch
    </button>
    <button class="{{tabCls.trophies}}" onClick="{{goTrophies}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"></path></svg>
      Trophies
    </button>
    <button class="{{tabCls.event}}" onClick="{{goEvent}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg>
      Events
    </button>
  </nav>
</div>
</template>
