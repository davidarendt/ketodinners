<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>The Almanac</title>
<link rel="manifest" href="/weight/manifest.json">
<meta name="theme-color" content="#0c0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Almanac">
<link rel="apple-touch-icon" href="/weight/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/weight/static/styles.css">
</head>
<body>

<!-- Auth screen -->
<section id="authScreen" class="auth" hidden>
  <div class="auth-inner">
    <div class="masthead auth-masthead">
      <div class="wordmark">The Almanac</div>
      <div class="tagline">A Record of Mass &amp; Trend</div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="login">Sign in</button>
      <button class="auth-tab" data-mode="register">Create account</button>
    </div>
    <form id="authForm" class="auth-form" autocomplete="off">
      <label class="field">
        <span class="field-label">Username</span>
        <input id="authUser" class="field-input" type="text" inputmode="text" autocapitalize="none" autocomplete="username" spellcheck="false" placeholder="e.g. dave">
      </label>
      <label class="field">
        <span class="field-label">Passcode</span>
        <input id="authPass" class="field-input" type="password" autocomplete="current-password" placeholder="••••••">
      </label>
      <button id="authSubmit" type="submit" class="btn">Sign in</button>
      <p id="authError" class="auth-error" hidden></p>
      <p id="authHint" class="auth-hint">Your entries are private to your account. Share the link — everyone gets their own.</p>
    </form>
  </div>
</section>

<!-- Dashboard (rendered by app.js) -->
<main id="dashScreen" class="dash" hidden></main>

<script src="/weight/static/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/weight/sw.js', { scope: '/weight/' }).catch(function () {});
  });
}
</script>
</body>
</html>
