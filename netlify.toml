[build]
  publish = "web"
  functions = "netlify/functions"

[functions]
  included_files = ["recipes/claude/**", "recipes/raw-html/**/*.html"]

# --- Security headers (site-wide) ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    X-Frame-Options = "SAMEORIGIN"

# --- Long-cache immutable static assets (icons/images only; NOT js/css/html,
#     which the service workers keep fresh via network-first). ---
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/weight/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/house-quest/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/static/mark.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/static/logo-horizontal.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/recipes"
  to = "/.netlify/functions/recipes"
  status = 200

[[redirects]]
  from = "/api/recipe-states"
  to = "/.netlify/functions/recipe-states"
  status = 200

[[redirects]]
  from = "/api/recipe-state"
  to = "/.netlify/functions/recipe-state"
  status = 200

[[redirects]]
  from = "/api/recipe-edit"
  to = "/.netlify/functions/recipe-edit"
  status = 200

[[redirects]]
  from = "/api/recipe-upload"
  to = "/.netlify/functions/recipe-upload"
  status = 200

[[redirects]]
  from = "/api/shopping-list"
  to = "/.netlify/functions/shopping-list"
  status = 200

[[redirects]]
  from = "/mealime/*"
  to = "/.netlify/functions/mealime-recipe/:splat"
  status = 200

[[redirects]]
  from = "/api/cook-log"
  to = "/.netlify/functions/cook-log"
  status = 200

# --- Weight tracker (side project at /weight/) ---
[[redirects]]
  from = "/api/weight-auth"
  to = "/.netlify/functions/weight-auth"
  status = 200

[[redirects]]
  from = "/api/weight-entries"
  to = "/.netlify/functions/weight-entries"
  status = 200

[[redirects]]
  from = "/api/weight-push"
  to = "/.netlify/functions/weight-push"
  status = 200

[[redirects]]
  from = "/api/weight-ingest"
  to = "/.netlify/functions/weight-ingest"
  status = 200

# Reminder sender runs every 15 minutes (scheduled function).
[functions."weight-reminders"]
  schedule = "*/15 * * * *"

# --- House Quest (two-player house-upgrade game at /house-quest/) ---
[[redirects]]
  from = "/api/hq-auth"
  to = "/.netlify/functions/hq-auth"
  status = 200

[[redirects]]
  from = "/api/hq-state"
  to = "/.netlify/functions/hq-state"
  status = 200

[[redirects]]
  from = "/api/hq-actions"
  to = "/.netlify/functions/hq-actions"
  status = 200

[[redirects]]
  from = "/api/hq-upload"
  to = "/.netlify/functions/hq-upload"
  status = 200

[[redirects]]
  from = "/api/hq-push"
  to = "/.netlify/functions/hq-push"
  status = 200

# Scheduled jobs (cron is UTC; each function self-gates to America/New_York).
[functions."hq-deposit"]
  schedule = "0 10,11,12 * * *"   # ~6am ET, once per week on the deposit day
[functions."hq-drops"]
  schedule = "0 13,16,19,22 * * *" # spread across 9am–8pm ET
[functions."hq-holidays"]
  schedule = "0 12,13 * * *"       # ~8am ET
[functions."hq-nudges"]
  schedule = "0 14,15 * * *"       # ~10am ET
[functions."hq-push-sender"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/recipes/*"
  to = "/.netlify/functions/recipe-page"
  status = 200
